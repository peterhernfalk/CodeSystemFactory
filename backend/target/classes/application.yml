server:
  port: ${PORT:8080}

spring:
  application:
    name: codesys-backend
  ai:
    openai:
      # Provider-agnostic AI configuration via OpenAI-compatible endpoint.
      # Recommended free hosted option:
      # - Gemini: AI_PROVIDER=gemini, AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      # Optional free local option:
      # - Ollama: AI_PROVIDER=ollama, AI_BASE_URL=http://localhost:11434
      api-key: ${AI_API_KEY:${OPENAI_API_KEY:sk-mock-dev-key-1234567890123456789012345678901234567890}}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        options:
          model: ${AI_MODEL:gemini-2.0-flash}

ai:
  enabled: ${AI_ENABLED:true}
  provider: ${AI_PROVIDER:gemini}

fhir:
  server:
    # Used by hybrid recommendations (concept lookup, hierarchy, ValueSet/$expand).
    # Default to public Ontoserver — Snowstorm training is often unreachable.
    url: ${FHIR_SERVER_URL:https://r4.ontoserver.csiro.au/fhir}

# Ontoserver configuration (FHIR R4 terminology server)
ontoserver:
  url: ${ONTOSERVER_URL:https://r4.ontoserver.csiro.au/fhir}

# Inera Terminologitjänsten (Swedish SNOMED CT FHIR API)
inera:
  url: ${INERA_URL:https://terminologitjansten.inera.se/fhir}
  valueset-url: ${INERA_VALUESET_URL:http://snomed.info/sct/45991000052106/version/20251130?fhir_vs}

snomed:
  #branch: ${SNOMED_BRANCH:MAIN}
  #language: ${SNOMED_LANGUAGE:en}
  #language-refset: ${SNOMED_LANGUAGE_REFSET:}
  #fallback-to-english: ${SNOMED_FALLBACK_TO_ENGLISH:true}
  branch: MAIN
  language: sv
  language-refset: 
  fallback-to-english: true

recommendation:
  # Use hybrid recommendation approach (combines multiple strategies)
  use-hybrid: true
  # Fuzzy matching: candidates with similarity in this range will be recommended
  fuzzy-match:
    min-similarity: 0.4
    max-similarity: 0.6
  # Hierarchical search: maximum number of parent/child concepts to suggest
  hierarchical:
    max-results: 10
    # Multi-hop hierarchy expansion depth used to widen the candidate pool.
    # hop-depth=1 equals old behavior (parents + children). hop-depth=2 adds grandparents/grandchildren.
    hop-depth: ${RECOMMENDATION_HIERARCHICAL_HOP_DEPTH:2}
  # Use AI agent as fallback for unmatched terms after other strategies
  ai-fallback: true
  # When true, ADDITIONAL mode does not fill from the deterministic pool if the model returns nothing
  ai-only-additional: ${RECOMMENDATION_AI_ONLY_ADDITIONAL:false}

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Additional Swagger UI configuration
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
