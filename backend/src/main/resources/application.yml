server:
  port: ${PORT:8080}

spring:
  application:
    name: codesys-backend
  ai:
    openai:
      # Provide a mock API key for development when OPENAI_API_KEY is not set
      # Spring AI needs this to initialize, but it won't be used when ai.enabled=false
      # Format: sk- followed by alphanumeric characters (OpenAI key format)
      api-key: ${OPENAI_API_KEY:sk-mock-dev-key-1234567890123456789012345678901234567890}
      chat:
        options:
          model: gpt-4o-mini

ai:
  enabled: false

fhir:
  server:
    url: ${FHIR_SERVER_URL:https://snowstorm-training.snomedtools.org/fhir}

snomed:
  #branch: ${SNOMED_BRANCH:MAIN}
  #language: ${SNOMED_LANGUAGE:en}
  #language-refset: ${SNOMED_LANGUAGE_REFSET:}
  #fallback-to-english: ${SNOMED_FALLBACK_TO_ENGLISH:true}
  branch: MAIN
  language: sv
  language-refset: 
  fallback-to-english: true

recommendation:
  # Use hybrid recommendation approach (combines multiple strategies)
  use-hybrid: true
  # Fuzzy matching: candidates with similarity in this range will be recommended
  fuzzy-match:
    min-similarity: 0.4
    max-similarity: 0.6
  # Hierarchical search: maximum number of parent/child concepts to suggest
  hierarchical:
    max-results: 10
  # Use AI agent as fallback for unmatched terms after other strategies
  ai-fallback: true

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Additional Swagger UI configuration
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
